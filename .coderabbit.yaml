# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: pt-BR

reviews:
  profile: chill
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_instructions: >
    Resuma o PR em bullets curtos com:
    - objetivo da mudança
    - apps Django impactados
    - risco funcional
    - impacto em regras de negócio
    - impacto em autenticação, autorização, escopo por perfil e escopo por setor
    - impacto em contratos DRF, serializers, paginação, filtros, envelope de erro e OpenAPI
    - impacto em integridade de dados, constraints, snapshots históricos, auditoria e rastreabilidade
    - impacto em transações, concorrência, idempotência, saldo físico, saldo reservado e saldo disponível
    - impacto em importação SCPI, dados oficiais de materiais ou divergência de estoque
    - impacto em configuração, CI, dependências, lint, testes ou ambiente efêmero
    - como validar manualmente via API, admin, comando ou teste automatizado

    Priorize apontamentos sobre:
    - lógica de negócio, autorização contextual, transições de estado, side effects ou transações colocadas fora de services.py
    - divergências entre implementação e docs/design-acesso-rapido/
    - risco de inconsistência de dados, saldo negativo, reserva acima do disponível ou reprocessamento indevido por retry
    - falhas de autorização por papel, setor, visibilidade indevida entre setores ou superusuário operando fluxo cotidiano
    - mudanças que quebrem rastreabilidade, snapshot histórico, imutabilidade futura de movimentos ou auditoria
    - violação da direção de dependências entre apps
    - N+1 queries, select_related/prefetch_related ausentes onde houver impacto real
    - exigência indevida de migrations versionadas no contexto efêmero atual

  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 10
    ignore_title_keywords:
      - wip
      - draft
      - do not review
      - poc
    labels:
      - "!wip"
      - "!skip-coderabbit"
    base_branches:
      - "^main$"

  path_instructions:
    - path: "apps/**/services.py"
      instructions: >
        Este é o ponto mais crítico para regra de negócio.
        Revise com rigor máximo domínio, transações atômicas, concorrência,
        idempotência, integridade de dados, side effects, escopo por perfil/setor
        e aderência a docs/design-acesso-rapido/.
        Trate como alta severidade qualquer PR que mova regra de negócio,
        autorização contextual, transições de estado, side effects ou fronteiras
        transacionais para views.py, serializers.py, models.py, admin.py,
        signals.py, managers, commands ou helpers genéricos sem justificativa
        arquitetural clara.

        Services devem revalidar autorização contextual em escritas, mesmo quando
        a view já usa permission_classes. Operações que alterem estoque, reserva,
        número público, importação aplicada ou histórico auditável devem ser
        transacionais e protegidas contra retry/reexecução.

    - path: "apps/**/policies.py"
      instructions: >
        Revise como fonte central de autorização contextual.
        Views e services devem chamar a mesma policy para evitar divergência entre
        contrato HTTP e gravação efetiva.
        Priorize brechas de autorização, IDOR, elevação indevida de privilégio,
        acesso cruzado entre setores, superusuário executando ações operacionais
        e desalinhamento com docs/design-acesso-rapido/matriz-permissoes.md.

    - path: "apps/core/api/**/*.py"
      instructions: >
        Este pacote é infraestrutura DRF comum, não domínio.
        Revise paginação, envelope de erro, exceções HTTP-safe, serializers comuns,
        schema OpenAPI e integração com DRF/drf-spectacular.
        Não aceite acoplamento de apps de domínio dentro de apps/core/api.
        Verifique aderência a docs/design-acesso-rapido/api-contracts.md:
        session auth + CSRF por padrão, listas paginadas, detalhes sem envelope de
        sucesso global, erros em {"error": {"code", "message", "details", "trace_id"}},
        409 domain_conflict para conflito de domínio e mensagens PT-BR com códigos
        técnicos em inglês.

    - path: "apps/users/**/*.py"
      instructions: >
        Foque em autenticação por matricula_funcional, usuário inativo, Setor,
        papel, chefe responsável e policies compartilhadas.
        Regras estáveis do v2:
        - login usa matricula_funcional única
        - CPF e telefone não são cadastro permanente
        - usuário pertence a um único setor
        - setor deve ter chefe responsável
        - um chefe não responde por dois setores
        - chefe de Almoxarifado autoriza apenas o setor canônico Almoxarifado
        - superusuário é suporte/administração técnica, não operador cotidiano de estoque
        Sinalize regressões no caminho real de autenticação Django/Admin/sessão,
        inclusive authenticate(username=..., password=...), e não apenas chamadas
        específicas do backend customizado.

    - path: "apps/materials/**/*.py"
      instructions: >
        Foque em integridade cadastral SCPI de GrupoMaterial, SubgrupoMaterial e
        Material.
        Campos oficiais vindos do SCPI não devem virar cadastro livre mantido pelo
        WMS em fluxos operacionais normais.
        Códigos de grupo/subgrupo devem permanecer exatamente com 3 dígitos
        numéricos, reforçados por validação e constraint quando houver risco real
        de bypass.
        Revise unicidade, related_name, on_delete, filtros, busca textual e
        exposição de campos oficiais como read-only em admin/API quando aplicável.
        O campo local editável esperado é observação interna, não os dados oficiais
        do SCPI.

    - path: "apps/stock/**/*.py"
      instructions: >
        Foque em EstoqueMaterial, saldo_fisico, saldo_reservado e
        saldo_disponivel.
        Regra estável: saldo_disponivel = saldo_fisico - saldo_reservado.
        Não aceite ajuste manual de estoque via admin ou endpoint operacional no
        MVP. Mudanças futuras que alterem saldo/reserva devem usar transaction.atomic(),
        select_for_update() quando houver concorrência, ordem determinística de locks
        e testes PostgreSQL quando o comportamento depender de locking/constraints.
        Sinalize risco de saldo negativo, reserva acima do disponível, físico menor
        que reservado sem marcação de divergência, ou caminho que permita material
        inativo/divergente em nova requisição.

    - path: "apps/requisitions/**/*.py"
      instructions: >
        Este app pode aparecer em PRs futuros. Revise contra
        docs/design-acesso-rapido/estado-transicoes-requisicao.md,
        matriz-invariantes.md e matriz-permissoes.md.
        Foque em rascunho, envio, autorização, recusa, retorno, cancelamento,
        atendimento, snapshot do setor do beneficiário, número público anual,
        consistência entre requisição e itens, reserva/baixa/liberação de estoque
        e timeline auditável.
        Não aceitar transições espalhadas em if/elif por views/serializers.
        A máquina de estados deve ter uma fonte de verdade clara em service/use case.

    - path: "apps/imports/**/*.py"
      instructions: >
        Este app pode aparecer em PRs futuros para SCPI CSV.
        Revise normalização, pré-visualização e aplicação como serviço reutilizável.
        O CSV SCPI é fonte oficial para cadastro de materiais e correção de saldo
        físico; aplicação deve ser transacional quando persistir dados.
        Erros técnicos impeditivos devem aplicar tudo ou nada. Alertas/divergências
        podem exigir confirmação explícita, mas não devem corromper dados oficiais.
        Material ausente no CSV não deve ser inativado automaticamente.

    - path: "apps/**/models.py"
      instructions: >
        Revise nullability, defaults, constraints, indexes, related_name, on_delete,
        unicidade, choices, validação estrutural e compatibilidade com as regras do
        domínio.
        Não incentive regra de negócio complexa em save(), clean(), managers ou
        properties quando ela pertencer a services/use cases.
        full_clean() e validação de serializer não bastam para invariantes críticos
        que precisam resistir a bypass por ORM, bulk operations ou concorrência.
        No contexto efêmero atual, models/constraints/testes são fonte de verdade;
        migrations geradas são artefatos locais.

    - path: "apps/**/views.py"
      instructions: >
        Revise como camada fina DRF.
        Foque em permission_classes, escopo do queryset, IDOR, filtros públicos,
        códigos HTTP, @extend_schema, serializers de input/output e delegação para
        services.py quando houver regra de domínio.
        Views não devem conter regra central de autorização contextual, transição de
        estado, mutação de saldo/reserva, importação aplicada ou side effect.

    - path: "apps/**/serializers.py"
      instructions: >
        Revise validação de formato, tipos, coerência local do payload, campos
        read-only/write-only, campos sensíveis e representação de saída.
        Serializers não devem virar service layer nem conter autorização contextual,
        regra crítica de domínio ou side effects.
        Contratos de API devem seguir os nomes e padrões de
        docs/design-acesso-rapido/api-contracts.md quando houver endpoint formal.

    - path: "apps/**/filters.py"
      instructions: >
        Foque em filtros tipados com django-filter, busca/ordenação com allowlist
        explícita e não vazamento de campos sensíveis.
        Regras de visibilidade por usuário, setor ou papel não devem ser escondidas
        em filtros públicos; devem ficar em policy/queryset controlado.

    - path: "apps/**/urls.py"
      instructions: >
        Verifique coerência entre rotas e contratos de API.
        Endpoints formais devem ficar sob /api/v1/ quando estabilizados.
        Ações customizadas precisam ter semântica, status, permissões e schema
        coerentes com docs/design-acesso-rapido/api-contracts.md.

    - path: "apps/**/admin.py"
      instructions: >
        Revise segurança operacional do Django Admin.
        Admin não deve expor ações perigosas em massa nem permitir operação cotidiana
        de estoque fora dos services.
        Para users/materials/stock, respeite restrições de campos oficiais SCPI,
        papéis/setores, usuário inativo, ausência de ajuste manual de estoque e
        superfícies read-only quando o domínio exigir.

    - path: "apps/**/migrations/*.py"
      instructions: >
        Migrations locais de apps são efêmeras neste estágio e normalmente não devem
        ser versionadas nem exigidas em PR.
        Não faça comentários pedindo editar/commitar migrations geradas apenas para
        o ambiente local. Foque no model, constraints, índices e testes.
        Exceção: se o PR for explicitamente de preparação para staging/produção ou
        migração de dados real, revisar risco destrutivo, compatibilidade e plano de
        aplicação.

    - path: "apps/**/tests/**/*.py"
      instructions: >
        Foque em cobertura de regra de negócio, autorização, escopo por setor,
        contratos DRF, envelope de erro, regressões, idempotência, concorrência e
        transições de estado.
        Para endpoints, exigir caminho feliz, não autenticado, permission denied,
        input inválido, 409 domain_conflict quando aplicável, paginação/filtros/
        ordenação e OpenAPI.
        Para estoque/reserva/ledger/concurrency, testes SQLite não provam locking;
        exigir teste PostgreSQL quando a regra depender de select_for_update(),
        constraints parciais, índices ou corrida real.

    - path: "config/**/*.py"
      instructions: >
        Revise settings, URLs raiz, ASGI/WSGI e configuração de apps com foco em
        segurança, ambiente, autenticação, DRF, drf-spectacular, django-filter,
        logging, DATABASE_URL e consistência entre dev/test/prod.
        Evite duplicação divergente de INSTALLED_APPS entre settings.
        Secrets não devem ser versionados.

    - path: "requirements*.txt"
      instructions: >
        Revise apenas impacto real de dependências, segurança, compatibilidade,
        remoções perigosas e efeito no ambiente. O projeto usa uv/lockfile; não
        sugerir fluxo pip manual como padrão quando o repo define rtk/uv.

    - path: "pyproject.toml"
      instructions: >
        Revise impacto em lint, format, pytest, coverage, dependências e tooling.
        O baseline esperado é ruff check, ruff format --check e pytest via rtk/uv.

    - path: "Makefile"
      instructions: >
        Revise comandos como contrato operacional do ambiente efêmero.
        rtk make init é setup inicial, rtk make setup recria ambiente/migrations
        locais, rtk make test executa a suíte e lint deve ser check-only alinhado à CI.

    - path: ".github/workflows/*.yml"
      instructions: >
        Revise qualidade do CI, execução de lint/testes/checks Django, segurança de
        secrets e confiabilidade do pipeline.
        Considere que o fluxo do projeto exige ruff + pytest como gates reais e que
        migrations locais de apps são geradas de forma efêmera quando necessário.

    - path: "docs/design-acesso-rapido/**/*.md"
      instructions: >
        Estes docs são a referência operacional rápida para agentes e review.
        Sinalize contradições entre API, permissões, invariantes, stack e transições.
        Não aceitar mudança de código que altere contrato, permissão, estado, saldo,
        importação ou auditoria sem atualizar o doc rápido afetado quando a decisão
        do produto/arquitetura mudar.

    - path: "docs/code-review-guidelines.md"
      instructions: >
        Este documento orienta o próprio CodeRabbit.
        Revise para manter alinhamento com AGENTS.md, docs/design-acesso-rapido/ e
        estado atual materializado do v2. Evite trazer regras específicas do repo
        antigo que ainda não existem aqui, salvo como invariantes futuras claramente
        documentadas.

    - path: "apps/notifications/**/*.py"
      instructions: >
        Foque em notificações push (Web Push/VAPID), handlers de eventos e entrega
        assíncrona via publish_on_commit().
        Regras críticas: handlers não devem decidir o sucesso da operação principal;
        side effects de notificação devem ser registrados pós-transação, nunca dentro
        do bloco atômico que altera o domínio.
        Revise models de assinatura push (endpoint, chaves), serializers de preferências,
        policies de visibilidade (usuário só acessa próprias notificações) e serviços
        de envio para garantir que falhas de entrega não propaguem exceção para o chamador.
        Sinalize qualquer exposição de chave VAPID privada, armazenamento de endpoint sem
        validação de origem ou ausência de limpeza de assinaturas expiradas.

    - path: "apps/analytics/**/*.py"
      instructions: >
        Foque em coleta de métricas operacionais (tempos de ciclo de requisição, SLA,
        alertas de prazo) e integridade dos dados agregados.
        Analytics deve ser read-only sobre dados de domínio; não deve gravar diretamente
        em tabelas de requisições, estoque ou usuários.
        Revise queries de agregação para N+1, ausência de índices em colunas filtradas
        por data/status e exposição de dados cruzados entre setores (visibilidade por
        perfil deve ser respeitada mesmo em endpoints analíticos).
        Sinalize endpoints sem paginação quando o conjunto de dados puder crescer
        ilimitadamente, métricas que vazem informações de setores não autorizados ao
        usuário corrente e ausência de cache quando queries forem custosas e os dados
        tolerarem staleness.

    - path: "apps/core/events.py"
      instructions: >
        Este módulo é a infraestrutura de eventos pós-transação (publish_on_commit).
        Revise com foco em: garantia de que handlers só disparam após commit confirmado,
        ausência de acoplamento de lógica de domínio dentro de handlers genéricos,
        comportamento em caso de rollback (handlers não devem ser chamados) e
        reentrada/idempotência de handlers quando o mesmo evento for emitido mais de uma vez.
        Sinalize qualquer pattern que execute side effects (envio de notificação, chamada
        externa, gravação derivada) dentro de transaction.atomic() em vez de pós-commit.

    - path: "apps/web/**/*"
      instructions: >
        Este app é o frontend server-rendered oficial do WMS-SAEP.
        Revise contra docs/design-acesso-rapido/manual-operacional-frontend.md.
        apps/web deve conter composição visual, shell, templates, partials HTMX,
        assets globais, helpers HTMX, navegação e views HTML finas.
        Apps de domínio continuam responsáveis por models, forms, selectors,
        services, policies, validações e context builders.

        Trate como regressão arquitetural qualquer regra de negócio, autorização,
        transição de estado, query complexa, cálculo de saldo, workflow operacional,
        importação SCPI, auditoria ou validação final de domínio implementada em
        template, view HTML, Alpine.js, JavaScript ou helper visual de apps/web.

        Todo PR frontend deve preencher o Frontend Handoff Contract no PR ou
        referenciar issue que o contenha. PR frontend sem handoff preenchido é
        incompleto. O review deve comparar os arquivos alterados com o contrato
        declarado: tipo de entrega, jornada, categoria responsiva, paths oficiais,
        contrato HTMX, acessibilidade, segurança, testes e fora de escopo.

    - path: "apps/web/views/**/*.py"
      instructions: >
        Revise views HTML como camada fina de orquestração server-rendered.
        Views podem autenticar, chamar selectors/context builders/forms/services do
        app de domínio, escolher template/partial e montar resposta HTTP segura.
        Não devem conter regra de negócio, autorização contextual própria,
        transição de estado, query complexa, mutação operacional, cálculo de saldo,
        montagem de permissão ou workflow.

        Para HTMX, verifique uso de helpers de apps/web/htmx.py, status HTTP
        corretos, partial correta, target/swap declarados, tratamento de 401 com
        HX-Redirect ou HX-Refresh, 403 seguro, 409 para conflito de domínio e 422
        para formulário inválido. Não aceitar login renderizado dentro de partial
        operacional nem headers HTMX manuais repetidos sem helper ou justificativa.

    - path: "apps/web/htmx.py"
      instructions: >
        Este módulo concentra helpers HTMX oficiais.
        Revise para garantir respostas consistentes para render_htmx,
        htmx_redirect, htmx_refresh, htmx_trigger, htmx_retarget,
        htmx_validation_error, htmx_forbidden, htmx_conflict e
        htmx_session_expired quando existirem.

        Helpers devem padronizar status, headers e comportamento de erro sem
        acoplar domínio. Sinalize execução de regra operacional, side effects,
        autorização contextual, renderização de login dentro de partial, 200 para
        todos os erros, redirects externos não validados e headers construídos de
        forma insegura.

    - path: "apps/web/navigation.py"
      instructions: >
        Revise navegação por papel como allowlist backend renderizada pelo template.
        A navegação deve ser montada por função/context builder, usar URLs resolvidas
        de forma estável e servir tanto desktop quanto mobile com a mesma árvore.

        Template não deve montar menu com ifs de permissão nem receber user/request
        em include para decidir autorização. Menu não é autorização: toda rota/action
        protegida deve validar autenticação e permissão no backend. Sinalize itens
        técnicos como labels operacionais, vazamento de itens entre papéis, active
        state frágil, query pesada para contador sem decisão explícita e árvore
        duplicada para mobile.

    - path: "apps/web/templates/**/*.html"
      instructions: >
        Revise templates Django como camada passiva de apresentação.
        Templates de página devem ficar em apps/web/templates/web/pages/<jornada>/,
        partials HTMX junto da jornada como _*.html, layouts em
        apps/web/templates/web/layouts/ e componentes compartilhados em
        apps/web/templates/web/components/.

        Templates não devem conter regra de negócio, autorização, query complexa,
        cálculo de status visual, montagem de navegação, workflow, validação de
        domínio ou manipulação de saldo/reserva. Devem receber dados simples vindos
        de context builders/presenters do domínio, como labels, variants, booleans
        de ação já resolvidos, URLs e mensagens seguras.

        Sinalize templates em apps de domínio, base.html duplicado, shell paralelo,
        hardcode de paths quando houver rota nomeada, uso de request/user/model/
        object/queryset/policy em include para decidir comportamento, partial que
        retorna página completa indevidamente e uso de h1 em partial salvo quando
        substituir o conteúdo principal.

    - path: "apps/web/templates/web/layouts/**/*.html"
      instructions: >
        Revise layouts e shells como estrutura global única do frontend.
        Deve haver shell consistente com skip link, main id="main-content",
        regiões globais como global-feedback, global-errors e modal-root quando
        aplicável, navegação principal acessível e carregamento do CSS compilado
        oficial em web/dist/app.css.

        Não aceitar shell paralelo por jornada, base.html duplicado, Tailwind CDN,
        script inline solto, handlers onclick/onchange/onload, ausência de foco
        visível, ausência de landmarks ou navegação sem aria-label.

    - path: "apps/web/templates/web/components/**/*.html"
      instructions: >
        Revise includes oficiais como componentes pequenos, semânticos e com API
        estreita. Componentes iniciais esperados incluem button.html, badge.html,
        alert.html, form_field.html, empty_state.html, pagination.html e
        modal_shell.html.

        Componentes não devem receber user, request, permission, policy, model,
        object, queryset, raw_html, unsafe_html, script, onclick, onchange, style ou
        classes arbitrárias sem regra documentada. Devem expor parâmetros simples,
        estados acessíveis e variantes controladas. Não aceitar table.html ou
        card.html genéricos no MVP; use recipe ou partial específica de jornada.

    - path: "apps/web/templates/web/pages/**/*.html"
      instructions: >
        Revise páginas e partials por jornada.
        Páginas completas devem usar estrutura oficial, h1 único, main/shell
        apropriado, estados loading/empty/success/error/permission/conflict quando
        aplicável e componentes oficiais. Partials HTMX devem ter target estável,
        swap compatível, feedback e foco declarados no handoff.

        Worklists devem seguir recipe por categoria responsiva: mobile-primary usa
        cards/lista no mobile e baixa densidade; desktop-optimized pode usar tabela
        densa e filtros ricos; responsive-neutral mantém padrão simples. Não aceitar
        UI livre por jornada, status só por cor, erro tratado como vazio, ação
        destrutiva sem confirmação adequada ou múltiplos botões primários
        concorrentes.

    - path: "apps/web/static/web/src/styles.css"
      instructions: >
        Este é o arquivo oficial de entrada Tailwind CSS v4 CSS-first.
        Revise @import "tailwindcss", @source para templates autorizados, @theme
        para tokens visuais e @layer components/@apply apenas para recipes estáveis,
        repetidas e documentadas.

        Sinalize CSS paralelo por jornada, tokens de status divergentes, classes
        dinâmicas que o Tailwind não detecta, estética fora da direção visual do
        manual, perda de foco visível, contraste insuficiente, status dependente só
        de cor e alteração visual relevante sem atualização do design system quando
        necessário.

    - path: "apps/web/static/web/dist/app.css"
      instructions: >
        Este é artefato compilado do Tailwind e não deve ser editado manualmente.
        Não faça sugestões de ajuste direto neste arquivo. Se houver problema de
        estilo, revise a origem em apps/web/static/web/src/styles.css, templates ou
        scripts de build CSS.

    - path: "apps/web/static/web/js/**/*.js"
      instructions: >
        Revise JavaScript como progressive enhancement controlado.
        JS pode apoiar HTMX, acessibilidade, foco, drawer, modal e estado local
        pequeno. Não deve conter regra de negócio, autorização, validação final de
        domínio, workflow, cálculo de saldo, decisão de permissão ou dados sensíveis.

        Sinalize scripts inline soltos, handlers nativos onclick/onchange/onload em
        templates, chamadas a rotas externas via HTMX, x-html inseguro, JSON manual
        em template, dependência obrigatória de JS para fluxo que deveria funcionar
        server-rendered e ausência de fallback seguro.

    - path: "apps/web/tests/**/*.py"
      instructions: >
        Revise testes do frontend server-rendered com foco em contrato HTML/HTMX,
        segurança, acessibilidade e permissões visuais.
        O mínimo esperado é Django test client com assertions de template correto,
        página 200 autorizada, partial correta, targets HTMX, hx-* attrs, estados
        vazio/com dados, ações por permissão, endpoint protegido 403, sessão expirada
        401 com HX-Redirect/HX-Refresh, validação 422, conflito 409, headers HTMX e
        atributos acessíveis.

        Playwright é obrigatório quando houver fluxo crítico, modal com submit,
        HTMX + Alpine.js, múltiplos swaps, atualização parcial de tabela, redirect
        pós-sucesso, evento HTMX consumido no frontend, aprovação/rejeição,
        movimentação de estoque, operação destrutiva, mudança de permissão,
        regressão já identificada ou gate de lançamento.

    - path: "apps/**/templates/**/*.html"
      instructions: >
        Templates de página do frontend server-rendered não devem ser criados dentro
        de apps de domínio. A localização oficial é apps/web/templates/web/.
        Sinalize novos templates em apps/<domain>/templates/ salvo exceção técnica
        explicitamente justificada e alinhada ao manual operacional do frontend.

    - path: "apps/**/context.py"
      instructions: >
        Revise context builders/presenters de domínio como fronteira entre domínio e
        apresentação. Eles devem preparar dados simples de UI para apps/web, como
        labels, status_variant, can_cancel/can_authorize, URLs de actions, textos de
        empty state, listas autorizadas/paginadas e mensagens seguras.

        Context builders não substituem services ou policies: não devem executar
        mutações, transições de estado ou side effects. Também não devem expor dados
        sensíveis ao HTML nem empurrar models/querysets brutos para templates quando
        o manual exigir view models simples.
        