<!-- button.html: variant=primary|secondary|outline|ghost|danger, size=sm|md|lg, type=button|submit|reset, href, disabled, loading, hx_get/post/target/swap/confirm/trigger -->
{% if href %}
<a href="{{ href }}"
   class="btn btn-{{ variant|default:'primary' }}{% if size %} btn-{{ size }}{% endif %}{% if disabled %} opacity-50 pointer-events-none{% endif %}"
   {% if id %}id="{{ id }}"{% endif %}
   {% if testid %}data-testid="{{ testid }}"{% endif %}
   {% if disabled %}aria-disabled="true"{% endif %}>
  {% if loading %}
  <svg class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
  </svg>
  <span class="sr-only">Aguarde…</span>
  {% else %}
  {{ label }}
  {% endif %}
</a>
{% else %}
<button type="{{ type|default:'button' }}"
        class="btn btn-{{ variant|default:'primary' }}{% if size %} btn-{{ size }}{% endif %}"
        {% if id %}id="{{ id }}"{% endif %}
        {% if name %}name="{{ name }}"{% endif %}
        {% if value %}value="{{ value }}"{% endif %}
        {% if testid %}data-testid="{{ testid }}"{% endif %}
        {% if disabled or loading %}disabled aria-disabled="true"{% endif %}
        {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
        {% if hx_post %}hx-post="{{ hx_post }}"{% endif %}
        {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
        {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}
        {% if hx_confirm %}hx-confirm="{{ hx_confirm }}"{% endif %}
        {% if hx_trigger %}hx-trigger="{{ hx_trigger }}"{% endif %}>
  {% if loading %}
  <svg class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
  </svg>
  <span class="sr-only">Aguarde…</span>
  {% else %}
  {{ label }}
  {% endif %}
</button>
{% endif %}
