{% extends "web/layouts/base.html" %}

{% block body %}
<div class="min-h-dvh flex items-center justify-center px-4 py-12"
     style="background-color: var(--color-surface-muted);">

  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <p class="text-sm font-medium uppercase tracking-widest"
         style="color: var(--color-text-muted); font-family: var(--font-mono);">SAEP</p>
      <h1 class="text-2xl font-semibold mt-1" style="color: var(--color-text-primary);">
        WMS — Requisição de Materiais
      </h1>
    </div>

    <div class="rounded-lg shadow-sm p-8"
         style="background-color: var(--color-surface-raised); border: 1px solid var(--color-border);">

      <div id="global-feedback" aria-live="polite" aria-atomic="true"></div>
      <div id="global-errors" aria-live="assertive" aria-atomic="true"></div>

      {% block auth_content %}{% endblock %}
    </div>

  </div>
</div>
{% endblock %}
